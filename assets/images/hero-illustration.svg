<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4338ca" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glowing Blobs -->
  <circle cx="450" cy="150" r="140" fill="#c7d2fe" fill-opacity="0.6" filter="blur(40px)" />
  <circle cx="150" cy="350" r="120" fill="#a5f3fc" fill-opacity="0.4" filter="blur(40px)" />

  <!-- Main IDE / Dashboard Window -->
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="460" height="340" rx="20" fill="url(#heroCardGrad)" stroke="#4338ca" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="70" y="60" width="460" height="44" rx="20" fill="#0f172a" fill-opacity="0.7"/>
    <circle cx="102" cy="82" r="6" fill="#ef4444" />
    <circle cx="122" cy="82" r="6" fill="#f59e0b" />
    <circle cx="142" cy="82" r="6" fill="#10b981" />
    <rect x="180" y="73" width="160" height="18" rx="6" fill="#1e293b" />
    <text x="210" y="86" font-family="monospace" font-size="11" fill="#94a3b8">edtech_main.php</text>

    <!-- Code Line Simulators -->
    <text x="100" y="140" font-family="monospace" font-size="14" fill="#f43f5e">&lt;?php</text>
    <text x="100" y="170" font-family="monospace" font-size="14" fill="#93c5fd">$career <tspan fill="#e2e8f0">=</tspan> <tspan fill="#cbd5e1">new</tspan> <tspan fill="#38bdf8">SoftwareEngineer</tspan>();</text>
    <text x="100" y="200" font-family="monospace" font-size="14" fill="#93c5fd">$skills <tspan fill="#e2e8f0">=</tspan> [<tspan fill="#a7f3d0">'PHP'</tspan>, <tspan fill="#a7f3d0">'MySQL'</tspan>, <tspan fill="#a7f3d0">'Bootstrap 5'</tspan>];</text>
    <text x="100" y="230" font-family="monospace" font-size="14" fill="#93c5fd">$career<tspan fill="#e2e8f0">-&gt;</tspan><tspan fill="#fbbf24">levelUp</tspan>($skills);</text>
    <text x="100" y="260" font-family="monospace" font-size="14" fill="#4ade80">// Status: 100% Industry Ready 🚀</text>

    <!-- Mini Progress Card -->
    <rect x="100" y="300" width="400" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="120" y="328" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Bootcamp Progress</text>
    <text x="440" y="328" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">94%</text>
    <rect x="120" y="342" width="360" height="10" rx="5" fill="#334155" />
    <rect x="120" y="342" width="338" height="10" rx="5" fill="url(#codeGrad)" />
  </g>

  <!-- Floating Badge 1: 5-Star Rating -->
  <g transform="translate(40, 240)">
    <rect width="180" height="64" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))"/>
    <circle cx="34" cy="32" r="18" fill="#ecfdf5" />
    <path d="M34 22L37 28L43 29L39 34L40 40L34 37L28 40L29 34L25 29L31 28L34 22Z" fill="#10b981"/>
    <text x="62" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">4.9 / 5 Rating</text>
    <text x="62" y="44" font-family="sans-serif" font-size="10" fill="#64748b">From 15k+ Students</text>
  </g>

  <!-- Floating Badge 2: Verified Certificate -->
  <g transform="translate(380, 340)">
    <rect width="190" height="68" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))"/>
    <circle cx="36" cy="34" r="18" fill="#eff6ff" />
    <path d="M28 34L33 39L44 28" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Verified Certificate</text>
    <text x="64" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Industry Recognized</text>
  </g>
</svg>
