<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="php" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Code Browser Window Mockup -->
  <rect x="70" y="45" width="460" height="270" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="2"/>
  <rect x="70" y="45" width="460" height="38" rx="12" fill="#1e293b"/>
  <circle cx="94" cy="64" r="5" fill="#ef4444"/>
  <circle cx="110" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="126" cy="64" r="5" fill="#10b981"/>
  <rect x="150" y="56" width="200" height="16" rx="5" fill="#334155"/>
  <text x="160" y="68" font-family="monospace" font-size="10" fill="#94a3b8">index.php - Full-Stack App</text>

  <!-- Visual Elements Inside Code Screen -->
  <text x="100" y="120" font-family="monospace" font-size="15" fill="#38bdf8">&lt;div <tspan fill="#f43f5e">class=</tspan><tspan fill="#a7f3d0">"container py-5"</tspan>&gt;</text>
  <text x="120" y="150" font-family="monospace" font-size="15" fill="#fbbf24">&lt;?php <tspan fill="#e2e8f0">$courses = $db-&gt;query(...);</tspan> ?&gt;</text>
  <text x="120" y="180" font-family="monospace" font-size="15" fill="#c084fc">&lt;section <tspan fill="#f43f5e">class=</tspan><tspan fill="#a7f3d0">"course-grid"</tspan>&gt;</text>
  <text x="140" y="210" font-family="monospace" font-size="15" fill="#94a3b8">// Dynamic MySQL Rendering</text>
  <text x="120" y="240" font-family="monospace" font-size="15" fill="#c084fc">&lt;/section&gt;</text>
  <text x="100" y="270" font-family="monospace" font-size="15" fill="#38bdf8">&lt;/div&gt;</text>

  <!-- Floating Tech Badges -->
  <g transform="translate(380, 110)">
    <rect width="120" height="34" rx="8" fill="url(#accent)" />
    <text x="60" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PHP &amp; MySQL</text>
  </g>
  <g transform="translate(370, 160)">
    <rect width="130" height="34" rx="8" fill="#4f46e5" />
    <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Bootstrap 5</text>
  </g>
  <g transform="translate(360, 210)">
    <rect width="140" height="34" rx="8" fill="#0d9488" />
    <text x="70" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HTML5 &amp; CSS3</text>
  </g>
</svg>
